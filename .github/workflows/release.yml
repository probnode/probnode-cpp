name: release

# On a version tag: build and test once more, then publish a GitHub release with the source
# archive and its sha256 (what a FetchContent URL or a package-manager port pins).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'probnode/probnode-cpp'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != project version $v"; exit 1; }
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 4
      - run: ctest --test-dir build -R "^mock\." --output-on-failure
      - name: Source archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="probnode-cpp-${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" "$GITHUB_REF_NAME"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="probnode-cpp-${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "$name.tar.gz" "$name.tar.gz.sha256" \
            --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
