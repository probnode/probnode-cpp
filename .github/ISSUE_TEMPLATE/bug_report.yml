name: Bug report
description: Something in probnode-cpp does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste an API key anywhere in this form.
        Security issues go privately to hello@probnode.com, not here (see SECURITY.md).
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - probnode::Client
        - CMake build or install
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "The tag or commit you build, e.g. v0.1.0"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Compiler, CMake, libcurl and OS
      placeholder: "GCC 13, CMake 3.28, libcurl 8.5, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The code or command you ran, and what it printed, including the full error.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Dataset, schema, format, market or time range involved, if relevant.
