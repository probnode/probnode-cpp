version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # Its ref is a toolchain version (stable, or the MSRV), not a release of the action.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
